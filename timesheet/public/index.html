<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Timesheet — Azeredo &amp; Ugatti Advogados</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f2033'/><text x='16' y='22' font-size='15' font-family='sans-serif' font-weight='600' fill='%23f3ecdc' text-anchor='middle'>AU</text></svg>">
</head>
<body>

<!-- ------------------------------------------------------------------ login -->
<div id="login-screen" class="login-screen" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-brand">
      <div class="mark">AU</div>
      <h1>Azeredo &amp; Ugatti Advogados</h1>
      <p>Controle de horas</p>
    </div>
    <div id="login-alert" class="alert error" hidden></div>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Entrar</button>
    </div>
  </form>
</div>

<!-- -------------------------------------------------------------------- app -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="mark">AU</span><span>Timesheet</span></div>
    <div class="spacer"></div>
    <div class="who">
      <strong id="who-name"></strong>
      <span id="who-role"></span>
    </div>
    <button id="btn-account" class="btn btn-sm" type="button">Conta</button>
    <button id="btn-logout" class="btn btn-sm" type="button">Sair</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-view="lancar"      aria-selected="true">Lançar horas</button>
    <button role="tab" data-view="meus"        aria-selected="false">Meus lançamentos</button>
    <button role="tab" data-view="escritorio"  aria-selected="false" data-master>Horas do escritório</button>
    <button role="tab" data-view="relatorios"  aria-selected="false">Relatórios</button>
    <button role="tab" data-view="nota"        aria-selected="false" data-master>Nota fiscal</button>
    <button role="tab" data-view="clientes"    aria-selected="false" data-master>Clientes e projetos</button>
    <button role="tab" data-view="usuarios"    aria-selected="false" data-master>Usuários</button>
    <button role="tab" data-view="auditoria"   aria-selected="false" data-master>Auditoria</button>
  </nav>

  <main id="view"></main>
</div>

<div class="toast-stack" id="toasts"></div>
<div id="modal-root"></div>

<script src="/app.js"></script>
</body>
</html>
